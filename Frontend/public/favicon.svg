<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="g" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
  </defs>
  <!-- Dark circle background -->
  <circle cx="256" cy="256" r="256" fill="#0a0a0f"/>
  <!-- Gear teeth (12 teeth around a circle) -->
  <g fill="url(#g)">
    <rect x="234" y="20" width="44" height="60" rx="8"/>
    <rect x="234" y="432" width="44" height="60" rx="8"/>
    <rect x="20" y="234" width="60" height="44" rx="8"/>
    <rect x="432" y="234" width="60" height="44" rx="8"/>
    <rect x="82" y="68" width="44" height="60" rx="8" transform="rotate(45 104 98)"/>
    <rect x="386" y="384" width="44" height="60" rx="8" transform="rotate(45 408 414)"/>
    <rect x="386" y="68" width="44" height="60" rx="8" transform="rotate(-45 408 98)"/>
    <rect x="82" y="384" width="44" height="60" rx="8" transform="rotate(-45 104 414)"/>
  </g>
  <!-- Gear body ring -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="url(#g)" stroke-width="36"/>
  <!-- Inner circle cutout -->
  <circle cx="256" cy="256" r="100" fill="#0a0a0f"/>
  <!-- "V" letter -->
  <text x="256" y="300" text-anchor="middle" font-family="Inter,system-ui,sans-serif" font-weight="800" font-size="200" fill="url(#g)">V</text>
</svg>
